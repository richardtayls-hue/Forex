name: Update forex data
on:
  schedule:
    - cron: "30 22 * * 1-5"   # Mon-Fri 22:30 UTC, after the New York close
  workflow_dispatch:           # lets you run it by hand
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch.js
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update data" && git push)
